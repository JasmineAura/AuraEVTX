[package]
name = "aura-evtx"
version = "0.3.3"
description = "Local Windows event investigation workspace"
edition = "2021"

[lib]
name = "aura_evtx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
evtx = "0.12.3"
roxmltree = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
walkdir = "2"
csv = "1"
chrono = "0.4"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
